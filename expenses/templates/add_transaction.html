
{% extends 'base.html' %}

{% block content %}
{% load static %}
<h1 class="page-title">Add Transaction</h1>

<form method="POST">

    {% csrf_token %}

    <input type="number"
           name="amount"
           placeholder="Amount"
           required>

    <input type="text"
           name="description"
           placeholder="Description"
           required>

    <input type="date"
           name="date"
           required>

    <button class="btn" type="submit">
        Add Transaction
    </button>

</form>

{% endblock %}
