{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Forgot Password | LedGio</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
<div class="auth-page">
    <div class="auth-brand">
        <h1>LedGio</h1>
        <p>Password Recovery</p>
    </div>
    <div class="auth-card">
        <p class="balance-label">Security</p>
        <h2>Reset Password</h2>
        <p class="subtitle" style="margin-bottom: 25px;">Enter your email address and we'll send you a link to reset your password.</p>
        
        {% if form.errors %}
        <div class="auth-error">
            Please enter a valid email address.
        </div>
        {% endif %}

        <form method="POST" autocomplete="off">
            {% csrf_token %}
            <input type="email" name="email" placeholder="Registered Email" required style="width: 100%; padding: 14px 20px; background: rgba(15,23,42,0.6); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; color: white; margin-bottom: 20px; outline: none;">
            <button class="btn btn-primary" type="submit" style="width: 100%;">Send Reset Link</button>
        </form>
        
        <p class="auth-link" style="margin-top: 20px; text-align: center;">
            Remembered your password? <a href="/login/">Back to Login</a>
        </p>
    </div>
</div>
</body>
</html>
