{% extends 'base.html' %}
{% load static %}

{% block content %}

<div class="page-container">

    <div class="edit-hero">

        <div>
            <p class="balance-label">Transaction Manager</p>

            <h1>Edit Transaction</h1>

            <p class="subtitle">
                Update amount, type, description, and transaction date.
            </p>
        </div>

        <a href="/transactions/" class="btn btn-primary">
            ← Back
        </a>

    </div>

    <div class="edit-form-wrap">

        <div class="form-card edit-form-card">

            <form method="POST">

                {% csrf_token %}

                <label>Amount</label>
                <input type="number"
                       step="0.01"
                       name="amount"
                       value="{{ transaction.amount|cut:'-' }}"
                       placeholder="Amount"
                       required>

                <label>Description</label>
                <input type="text"
                       name="description"
                       value="{{ transaction.description }}"
                       placeholder="Description"
                       required>

                <label>Transaction Type</label>
                <select name="type" required>

                    <option value="income"
                        {% if transaction.trans_type == "income" %}
                            selected
                        {% endif %}>
                        Income
                    </option>

                    <option value="expense"
                        {% if transaction.trans_type == "expense" %}
                            selected
                        {% endif %}>
                        Expense
                    </option>

                </select>

                <label>Date</label>
                <input type="date"
                       name="date"
                       value="{{ transaction.date|date:'Y-m-d' }}"
                       required>

                <button class="btn btn-primary" type="submit">
                    Update Transaction
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
